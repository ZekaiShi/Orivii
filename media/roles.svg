<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="448" viewBox="0 0 1200 448" role="img" aria-labelledby="title desc">
  <title id="title">多个 Orivii，各有自己的聊天与记忆</title>
  <desc id="desc">概念示意：Orivii、阿栗、小舟三个可命名的角色，拥有独立资料，在设置中即时切换。</desc>
  <defs>
    <g id="eye" fill="none" stroke="#191a1e" stroke-width="9.2"><circle cx="50" cy="43" r="26.6"/></g>
    <g id="pupil"><circle cx="50" cy="43" r="10" fill="#191a1e"/><circle cx="54" cy="39" r="2.8" fill="#f7f4ed"/></g>
  </defs>
  <rect width="1200" height="448" rx="30" fill="#f7f4ed"/>
  <g font-family="Inter, 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#191a1e">
    <text x="48" y="49" font-size="14" letter-spacing="2" fill="#6c6479">ORIVII 1.0.1 / MORE WAYS TO CONNECT</text>
    <text x="48" y="101" font-size="33" font-weight="700">不同的相处方式，各自的聊天与记忆。</text>
    <rect x="48" y="134" width="352" height="236" rx="24" fill="#ded5f4"/>
    <rect x="424" y="134" width="352" height="236" rx="24" fill="#f5d3c7"/>
    <rect x="800" y="134" width="352" height="236" rx="24" fill="#e4edb6"/>
    <g transform="translate(70 159)"><use href="#eye"/><use href="#pupil"/></g>
    <g transform="translate(446 159)"><use href="#eye"/><path d="M35 46 Q40 36 45 46 M55 46 Q60 36 65 46" fill="none" stroke="#191a1e" stroke-width="5" stroke-linecap="round"/></g>
    <g transform="translate(822 159)"><use href="#eye"/><g transform="translate(-3 0)"><use href="#pupil"/></g></g>
    <text x="77" y="283" font-size="29" font-weight="700">Orivii</text>
    <text x="453" y="283" font-size="29" font-weight="700">阿栗</text>
    <text x="829" y="283" font-size="29" font-weight="700">小舟</text>
    <g font-size="18" fill="#514c5c">
      <text x="77" y="321">温柔一点，慢慢聊。</text>
      <text x="453" y="321">活泼一点，一起笑。</text>
      <text x="829" y="321">专注一点，把事做好。</text>
    </g>
    <text x="48" y="411" font-size="15" fill="#6c6479">角色示意 · 名字与表达方式由你决定</text>
    <text x="1152" y="411" font-size="15" text-anchor="end" fill="#6c6479">设置 → 我的 Orivii → 即时切换</text>
  </g>
</svg>
