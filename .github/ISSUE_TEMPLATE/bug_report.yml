name: 问题反馈
description: 报告安装、聊天、记忆或动画问题（请先脱敏）
title: "[Bug] "
labels: []
body:
  - type: markdown
    attributes:
      value: 请用新的测试工作空间和虚构内容复现。不要上传密码、令牌、真实记忆库、人格卡或完整日志。安全问题请先阅读 SECURITY.md。
  - type: input
    id: versions
    attributes:
      label: 插件与 DSH 版本
      placeholder: Orivii 版本；DSH 版本
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 运行环境
      placeholder: Windows/Linux/macOS；Web/Desktop；浏览器；模型名称（不填密钥）
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 最短复现步骤
      placeholder: 从打开插件开始，写出触发问题的操作。
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: 期望与实际结果
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 可选的脱敏截图或错误摘录
      description: 遮住个人名字、路径与其他聊天；只粘贴相关错误，不上传整份日志。
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私检查
      options:
        - label: 我已检查内容，不包含密钥、令牌、密码、真实记忆库或未脱敏的个人资料。
          required: true
